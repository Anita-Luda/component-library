<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radosna Biblioteka SPA</title>
    <link rel="stylesheet" href="admin-panel.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="loading">
    <aside id="sidebar">
        <div class="header">
            <h2>Biblioteka</h2>
            <div class="theme-picker">
                <label for="theme-select">Temat:</label>
                <select id="theme-select"></select>
            </div>
            <div class="search-box">
                <input type="text" id="comp-search" placeholder="Szukaj komponentu...">
            </div>
        </div>
        <nav id="category-nav">
            <!-- Categories will be injected here -->
        </nav>
    </aside>
    <main id="content">
        <header id="content-header">
            <h1 id="current-category-name">Wybierz kategorię</h1>
            <p id="category-description"></p>
        </header>
        <section id="component-list">
            <!-- Components will be injected here -->
        </section>
    </main>

    <template id="component-template">
        <div class="component-card">
            <h3 class="component-name"></h3>
            <div class="variants-grid"></div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
