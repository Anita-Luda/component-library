<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radosna Biblioteka Komponentów (Atomic Design)</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="admin-panel.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="loading">
    <a href="#content" class="skip-link">Skocz do treści</a>

    <aside id="sidebar" role="complementary">
        <div class="header">
            <h1>Biblioteka</h1>
            <div class="theme-picker">
                <label for="theme-select">Temat:</label>
                <select id="theme-select"></select>
            </div>
            <div class="search-box">
                <input type="search" id="comp-search" placeholder="Szukaj komponentu...">
            </div>
        </div>
        <nav id="category-nav">
            <!-- Categories will be injected here -->
        </nav>
    </aside>

    <main id="content" role="main" tabindex="-1">
        <header id="content-header">
            <h1 id="current-category-name">Witamy w Bibliotece</h1>
            <p id="category-description">Wybierz kategorię z lewego panelu.</p>
        </header>
        <div id="component-list">
            <!-- Components will be injected here -->
        </div>
    </main>

    <!-- ATOMIC DESIGN LAYERS -->
    <script src="lib/atoms.js"></script>
    <script src="lib/molecules.js"></script>
    <script src="lib/organisms.js"></script>
    <script src="lib/templates.js"></script>
    <script src="library.js"></script>
    <script src="app.js"></script>
</body>
</html>
