<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radosna Biblioteka Komponentów (WCAG AAA)</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="admin-panel.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="loading">
    <a href="#content" class="skip-link">Skocz do treści</a>

    <aside id="sidebar" role="complementary" aria-label="Nawigacja boczna">
        <div class="header">
            <h1>Biblioteka</h1>
            <div class="theme-picker">
                <label for="theme-select">Wybierz temat:</label>
                <select id="theme-select"></select>
            </div>
            <div class="search-box">
                <label for="comp-search" class="visually-hidden">Szukaj komponentu</label>
                <input type="search" id="comp-search" placeholder="Szukaj komponentu...">
            </div>
        </div>
        <nav id="category-nav" aria-label="Kategorie komponentów">
            <!-- Categories will be injected here -->
        </nav>
    </aside>

    <main id="content" role="main" tabindex="-1">
        <header id="content-header">
            <h1 id="current-category-name">Witamy w Bibliotece</h1>
            <p id="category-description">Wybierz komponent z lewego panelu, aby zobaczyć jego warianty i stany.</p>
        </header>
        <div id="component-list">
            <!-- Components will be injected here -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
